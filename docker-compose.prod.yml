services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: madrasa
      POSTGRES_PASSWORD: madrasa123
      POSTGRES_DB: madrasa_transport
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U madrasa -d madrasa_transport']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - ./deploy/.env.production
    environment:
      DATABASE_URL: postgresql://madrasa:madrasa123@postgres:5432/madrasa_transport
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports:
      - '5023:5023'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        API_INTERNAL_URL: http://api:3001
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
    ports:
      - '80:3000'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
